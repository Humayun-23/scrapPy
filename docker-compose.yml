# ─────────────────────────────────────────────────────────────────────────────
# Scrappy — Docker Compose
# Services: FastAPI + Redis + Hysteria2 client + Nginx
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrappy-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - HYSTERIA_PROXY=socks5://hysteria-client:1080
      - MAX_CONCURRENT_BROWSERS=5
      - PROXY_SECRET=${PROXY_SECRET}
      # Optional: Add a comma-separated list of proxies for rotation
      - PROXY_POOL=${PROXY_POOL:-}
      # Hysteria2 node hostnames
      - HYSTERIA_US_HOST=${HYSTERIA_US_HOST}
      - HYSTERIA_EU_HOST=${HYSTERIA_EU_HOST}
      - HYSTERIA_ASIA_HOST=${HYSTERIA_ASIA_HOST}
    depends_on:
      - redis
      - hysteria-client
    volumes:
      - ./app:/app/app
    networks:
      - scrappy-net
    # Shared memory for Chromium
    shm_size: "2gb"

  # ── Redis (usage tracking + API keys) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scrappy-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - scrappy-net

  # ── Hysteria2 Client (SOCKS5 proxy for CloakBrowser) ────────────────────────
  hysteria-client:
    build:
      context: ./hysteria
      dockerfile: Dockerfile
    container_name: scrappy-hysteria-client
    restart: unless-stopped
    environment:
      - HYSTERIA_CLIENT_SECRET=${HYSTERIA_CLIENT_SECRET}
    volumes:
      - ./hysteria/hysteria-client.yaml:/etc/hysteria/config.yaml:ro
    ports:
      - "1080:1080"
    networks:
      - scrappy-net
    entrypoint: ["/bin/sh", "-c"]
    command: ["envsubst < /etc/hysteria/config.yaml > /tmp/config.yaml && hysteria -c /tmp/config.yaml client"]

  # ── Hysteria2 Server (QUIC/HTTP3 ingress) ─────────────────────────────────
  hysteria-server:
    build:
      context: ./hysteria
      dockerfile: Dockerfile
    container_name: scrappy-hysteria-server
    restart: unless-stopped
    environment:
      - HYSTERIA_CLIENT_SECRET=${HYSTERIA_CLIENT_SECRET}
    volumes:
      - ./hysteria/hysteria-server.yaml:/etc/hysteria/config.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "443:443/udp"
    depends_on:
      - api
    networks:
      - scrappy-net
    entrypoint: ["/bin/sh", "-c"]
    command: ["envsubst < /etc/hysteria/config.yaml > /tmp/config.yaml && hysteria -c /tmp/config.yaml server"]

  # ── Worker (RQ job processor) ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrappy-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - HYSTERIA_PROXY=socks5://hysteria-client:1080
      - MAX_CONCURRENT_BROWSERS=5
      - JOB_QUEUE_NAME=scrappy
      # Optional: Add a comma-separated list of proxies for rotation
      - PROXY_POOL=${PROXY_POOL:-}
    depends_on:
      - redis
      - hysteria-client
    volumes:
      - ./app:/app/app
    networks:
      - scrappy-net
    shm_size: "2gb"
    command: ["rq", "worker", "scrappy"]

  # ── Nginx (TLS termination + rate limiting) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: scrappy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - scrappy-net

volumes:
  redis-data:

networks:
  scrappy-net:
    driver: bridge
