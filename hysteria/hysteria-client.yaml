# hysteria-client.yaml
# Runs on the SAME machine as FastAPI
# Creates a local SOCKS5 proxy on :1080 that CloakBrowser uses

server: 168.144.113.171:443   # your Hysteria2 server node

# Auth credentials (match what your server expects)
auth: scrappy-internal-client-secret

# TLS — verify your server cert
tls:
  sni: 168.144.113.171
  insecure: true              # set false once you use a valid domain cert

# Bandwidth hints — adjust to your VPS uplink
bandwidth:
  up: 100 mbps
  down: 500 mbps

# Local SOCKS5 proxy — CloakBrowser connects to this
socks5:
  listen: 0.0.0.0:1080       # allow access from other containers

# Local HTTP proxy — optional
http:
  listen: 0.0.0.0:8888

# Fast-close — reduces latency for short-lived browser sessions
fastOpen: true
lazy: true
